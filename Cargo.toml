[workspace]
resolver = "2"
members = ["crates/pi-rpc", "apps/pi-probe", "apps/desktop/src-tauri"]
exclude = ["scratch"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev]
# The GUI links a large Rust dependency graph; keep debug builds usable.
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
