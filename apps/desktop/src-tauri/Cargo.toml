[package]
name = "pi-workbench"
version = "0.1.0"
description = "Desktop workbench for the pi coding agent"
authors = ["LuoFeng <2721951388@qq.com>"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "pi_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Desktop only: keeps one app process and focuses the existing window when a
# second launch is attempted.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pi-rpc = { path = "../../../crates/pi-rpc" }
time = { version = "0.3.55", features = ["formatting"] }


[dev-dependencies]
tempfile = "3.27"
